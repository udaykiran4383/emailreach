# EmailReach background scheduler. Run from scheduler/: docker compose -f deploy/docker-compose.yml up
# Requires CRON_SECRET in the environment (or scheduler/.env next to this compose call).
# The EmailReach app runs on the host (npm run dev) and is reached via host.docker.internal.
version: '3.9'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: chronos-etcd
    environment:
      ALLOW_CLIENT_AUTOSET_ROUTES: 'false'
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: 1h
    ports:
      - '2379:2379'
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ['CMD', 'etcdctl', '--endpoints=localhost:2379', 'endpoint', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chronos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
    ports:
      - '2181:2181'
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ['CMD', 'echo', 'ruok', '|', 'nc', 'localhost', '2181']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chronos-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    ports:
      - '9092:9092'
      - '29092:29092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:9092']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chronos-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: chronos-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - '9090:9090'
    depends_on:
      - scheduler-1
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scheduler
    container_name: chronos-scheduler-1
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: development
      PORT: 3101
      ETCD_HOSTS: etcd:2379
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      EMAILREACH_URL: ${EMAILREACH_URL:-http://host.docker.internal:3000}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET to the value in EmailReach .env.local}
      EMAILREACH_TICK_SECONDS: ${EMAILREACH_TICK_SECONDS:-60}
    ports:
      - '3101:3101'
    depends_on:
      etcd:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scheduler
    container_name: chronos-scheduler-2
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: development
      PORT: 3102
      ETCD_HOSTS: etcd:2379
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      EMAILREACH_URL: ${EMAILREACH_URL:-http://host.docker.internal:3000}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET to the value in EmailReach .env.local}
      EMAILREACH_TICK_SECONDS: ${EMAILREACH_TICK_SECONDS:-60}
    ports:
      - '3102:3102'
    depends_on:
      etcd:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: chronos-worker-1
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      EMAILREACH_URL: ${EMAILREACH_URL:-http://host.docker.internal:3000}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET to the value in EmailReach .env.local}
      EMAILREACH_TICK_SECONDS: ${EMAILREACH_TICK_SECONDS:-60}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: chronos-worker-2
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      EMAILREACH_URL: ${EMAILREACH_URL:-http://host.docker.internal:3000}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET to the value in EmailReach .env.local}
      EMAILREACH_TICK_SECONDS: ${EMAILREACH_TICK_SECONDS:-60}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  etcd-data:
  zk-data:
  zk-logs:
  kafka-data:
  redis-data:
  prometheus-data:

networks:
  default:
    name: chronos-network
