global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'chronos-scheduler'

scrape_configs:
  - job_name: 'chronos-scheduler'
    static_configs:
      - targets: ['scheduler-1:3101', 'scheduler-2:3102']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

alerting:
  alertmanagers: []
